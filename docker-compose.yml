services:
  db:
    image: postgres:16-alpine
    container_name: order_platform_db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      POSTGRES_DB: order_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order_network

  app:
    build: .
    container_name: order_platform_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://order_user:order_pass@db:5432/order_platform"
      TEST_DATABASE_URL: "postgresql+asyncpg://order_user:order_pass@db:5432/order_platform_test"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - order_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  order_network:
    driver: bridge
