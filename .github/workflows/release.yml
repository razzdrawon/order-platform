name: Release

# Triggers when a release/* branch is merged into master.
# What it does:
#   1. Extracts the version from the branch name (release/1.2.0 → v1.2.0)
#   2. Creates a git tag on master
#   3. Creates a GitHub Release with auto-generated notes
#   4. Back-merges master into develop so it stays in sync

on:
  pull_request:
    branches: [master]
    types: [closed]

jobs:
  release:
    name: Tag and back-merge
    # Only run when the PR was actually merged (not just closed)
    # and only for release/* branches
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')

    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push tags and the back-merge commit

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # full history needed for tagging and merging

      - name: Extract version from branch name
        id: version
        run: |
          # release/1.2.0  →  v1.2.0
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="v${BRANCH#release/}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create git tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping."
          else
            git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true   # auto-generates notes from merged PRs

      - name: Back-merge master into develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          git merge master --no-ff -m "chore: back-merge ${{ steps.version.outputs.tag }} into develop"
          git push origin develop
